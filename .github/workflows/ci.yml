name: CotiTrama - pruebas y artefacto

'on':
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]

permissions:
  contents: read

concurrency:
  group: cotitrama-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reglas, aislamiento, Angular SSR y SAM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            services/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias del backend
        run: npm ci --prefix services
      - name: Instalar dependencias de Angular
        run: npm ci --prefix web
      - name: Verificar reglas y contratos de negocio
        run: npm test
      - name: Verificar frontend
        run: npm run test:web
      - name: Compilar y empaquetar Lambda SSR
        run: npm run build
      - name: Invocar el artefacto SSR sin AWS
        run: npm run smoke:ssr
      - name: Evitar archivos residuales de versiones anteriores
        run: npm run test:package
      - name: Validar CloudFormation y SAM
        run: |
          python -m pip install cfn-lint==1.60.1
          cfn-lint infra/template.yaml

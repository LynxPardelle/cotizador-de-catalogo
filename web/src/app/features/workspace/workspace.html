<main aria-labelledby="product-title">
  <header>
    <h1 id="product-title">{{ store.title() }}</h1>
    <p>{{ store.description() }}</p>
  </header>

  <section aria-labelledby="planned-areas">
    <h2 id="planned-areas">Flujos previstos</h2>
    <ul>
      @for (area of store.areas(); track area.id) {
        <li>
          <h3>{{ area.label }}</h3>
          <p>{{ area.description }}</p>
        </li>
      }
    </ul>
  </section>
</main>
